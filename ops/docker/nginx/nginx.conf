map $http_x_trace_id $kinlin_trace_id {
    default $request_id;
    "~^[0-9a-fA-F]{32}$" $http_x_trace_id;
    "~^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$" $http_x_trace_id;
}

log_format kinlin_json escape=json '{"timestamp":"$time_iso8601","level":"INFO","service":"kinlin-edge-nginx","trace_id":"$kinlin_trace_id","workflow_id":"","task_id":"","message":"HTTP access","exception":"","http_method":"$request_method","path":"$uri","status":$status,"duration_ms":$request_time}';
access_log /dev/stdout kinlin_json;

upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name localhost;

    # 重定向到HTTPS（生产环境）
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $kinlin_trace_id;
        proxy_hide_header X-Trace-Id;
        add_header X-Trace-Id $kinlin_trace_id always;
    }

    # /api 与 /ai 统一交给 frontend 容器内的 nginx 处理，
    # 避免顶层与前端层路由规则不一致（如 /api 前缀重写差异）
    location /api {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $kinlin_trace_id;
        proxy_hide_header X-Trace-Id;
        add_header X-Trace-Id $kinlin_trace_id always;
    }

    location /ai {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $kinlin_trace_id;
        proxy_hide_header X-Trace-Id;
        add_header X-Trace-Id $kinlin_trace_id always;
    }
}

