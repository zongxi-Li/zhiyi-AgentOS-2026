name: backend-ci

# J1.4D：Backend Architecture Freeze Gate 的唯一 CI 权威。
# 不做 path 过滤：根级 pom / 运行配置都能影响 backend 行为，
# 过滤省下的时间不值得漏跑风险。性能基准（@Tag("performance")）被 surefire
# excludedGroups 默认排除，不属于本 required gate（J1.4D §八）。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-gate:
    name: backend test + package gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 编译目标对齐 pom java.version=17；本机 N03 可用 JDK 21 运行，
      # CI 继续验证 Java 17 兼容性。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 零 Docker：PostgreSQL/Redis 集成测试由测试 JVM 自管临时实例，
      # runner 只需要本机二进制（不再使用 Testcontainers / Docker daemon）。
      - name: Install native PostgreSQL/Redis test services
        run: |
          # 保留 PostgreSQL 15.x 测试合同；不用发行版默认 major 或最高版本目录。
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-15 postgresql-client-15 redis-server
          PG_BIN=/usr/lib/postgresql/15/bin
          test -x "$PG_BIN/initdb"
          test -x "$PG_BIN/postgres"
          test -x "$(command -v redis-server)"
          echo "ZHIYI_PG_BIN=$PG_BIN" >> "$GITHUB_ENV"
          for tool in initdb postgres pg_ctl; do
            "$PG_BIN/$tool" --version | grep -E '\(PostgreSQL\) 15\.'
          done
          apt-cache policy postgresql-15 postgresql-client-15 redis-server
          redis-server --version

      # Required test gate：unit + architecture guard + 自管 PostgreSQL/Redis
      # 真实例（零 Docker 依赖）+ security contracts + observability contracts
      # （J1.4D §五/§十~十四）。
      - name: Run backend test gate (mvn test)
        working-directory: apps/backend
        run: mvn -B -ntp test

      - name: Package production jar
        working-directory: apps/backend
        run: mvn -B -ntp package -DskipTests

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_id }}
          path: apps/backend/target/surefire-reports/
          if-no-files-found: ignore
