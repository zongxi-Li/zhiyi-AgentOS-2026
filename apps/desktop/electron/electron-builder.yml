# 知弈 AgentOS Electron 桌面宿主打包配置（唯一桌面宿主）。
appId: com.kinlin.zhiyi.electron
productName: Zhiyi AgentOS Electron
directories:
  output: release
files:
  - dist/**
  - renderer/**
  - package.json
asar: true
icon: icons/icon.ico
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: 知弈 AgentOS Electron
  uninstallDisplayName: 知弈 AgentOS Electron
