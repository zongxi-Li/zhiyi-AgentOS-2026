[package]
name = "kinlin-desktop"
version = "0.1.0"
description = "知弈 AgentOS desktop shell"
authors = ["知弈 AgentOS"]
license = "MIT"
edition = "2021"
default-run = "kinlin-desktop"

[[bin]]
name = "kinlin-native-dev"
path = "src/native_dev.rs"

[[bin]]
name = "kinlin-integration-dev"
path = "src/integration_dev.rs"

[lib]
name = "kinlin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
