worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $http_x_trace_id $kinlin_trace_id {
        default $request_id;
        "~^[0-9a-fA-F]{32}$" $http_x_trace_id;
        "~^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$" $http_x_trace_id;
    }
    log_format kinlin_json escape=json '{"timestamp":"$time_iso8601","level":"INFO","service":"kinlin-frontend","trace_id":"$kinlin_trace_id","workflow_id":"","task_id":"","message":"HTTP access","exception":"","http_method":"$request_method","path":"$uri","status":$status,"duration_ms":$request_time}';
    access_log /dev/stdout kinlin_json;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    include /etc/nginx/conf.d/*.conf;
}
