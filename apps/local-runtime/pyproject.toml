[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiyi-local-runtime"
version = "0.1.0"
description = "Authorized local filesystem runtime for Zhiyi AgentOS"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../agentOS/src"]
asyncio_mode = "auto"
