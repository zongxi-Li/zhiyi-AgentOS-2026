spring:
  flyway:
    enabled: false

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        # J1.4C §八：Hibernate Statistics 供确定性 query-count 测量（仅测试面，生产不开启）
        generate_statistics: true

  cache:
    type: simple

  # dev 同款：真禁用 Redis（spring.data.redis.enabled 不是合法开关，
  # 旧的 data.redis.host/port 只会创建无人使用的连接工厂）。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

management:
  health:
    redis:
      enabled: false

ai:
  service:
    url: http://localhost:8000
    timeout: 5000
  internal:
    # 非生产测试值：出站 transport filter 需要合法形态的内部令牌（≥32 字符）
    token: test-only-internal-token-0123456789abcdef

logging:
  level:
    com.kinlin.ai: DEBUG
