# J1.4A 持久化契约 profile：真实 PostgreSQL（Testcontainers 动态注入 datasource）。
#
# 目标矩阵（任务书 §十三）：
#   DB        = 真实 PostgreSQL（容器，版本对齐生产 postgres:15.17-alpine）
#   Flyway    = true（migrate 权威）
#   ddl-auto  = validate（Hibernate 只做 schema 校验）
#   OSIV      = false（由 canonical application.yml 继承，此处不得覆盖）
#
# datasource url/username/password 由 @DynamicPropertySource 在运行期
# 指向 Testcontainers 容器，不依赖固定端口/本机 PostgreSQL/本地密码。
spring:
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  cache:
    type: simple

  # 与 dev/test 同款：真实 PG 契约测试不触碰 Redis，显式排除自动配置。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

management:
  health:
    redis:
      enabled: false

logging:
  level:
    com.kinlin.ai: INFO
