# 开发环境配置
server:
  port: ${SERVER_PORT:8080}

spring:
  flyway:
    enabled: false
  # 使用H2内存数据库
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  # H2控制台
  h2:
    console:
      enabled: true
      path: /h2-console
  
  cache:
    type: simple

  # 禁用Redis（使用内存缓存替代）。
  # 注意：spring.data.redis.enabled 不是 Spring Boot 的合法开关（不存在的
  # property），此前的"禁用"是假的——Redis 自动配置照样创建连接工厂。
  # 真实禁用 = 显式排除 Redis 自动配置（RedisConfig 的 RedisTemplate 死 bean
  # 已在 J1.4B 删除，不再有消费者需要连接工厂）。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

management:
  health:
    redis:
      enabled: false

# 日志配置
logging:
  level:
    com.kinlin.ai: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
