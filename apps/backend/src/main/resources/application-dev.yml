# 开发环境配置
server:
  port: ${SERVER_PORT:8080}

spring:
  flyway:
    enabled: false
  # 使用H2内存数据库
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  # H2控制台
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # 禁用Redis（使用内存缓存替代）
  data:
    redis:
      enabled: false

# 日志配置
logging:
  level:
    com.kinlin.ai: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

agent:
  python:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    lawyer-chat-url: ${AGENT_PYTHON_LAWYER_CHAT_URL:}
    teacher-chat-url: ${AGENT_PYTHON_TEACHER_CHAT_URL:}
    programmer-chat-url: ${AGENT_PYTHON_PROGRAMMER_CHAT_URL:}
    writer-chat-url: ${AGENT_PYTHON_WRITER_CHAT_URL:}
