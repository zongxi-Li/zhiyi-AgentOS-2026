spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  data:
    redis:
      host: redis
      port: 6379

app:
  upload:
    dir: /app/data/uploads
  jwt:
    # J1.4B fail-closed：生产禁止回落仓库默认 secret。
    # 打包部署：docker-entrypoint.sh 经 configtree 注入 app.jwt.secret
    # （Docker secret jwt_secret，缺失/为空即 exit 78 拒绝启动），
    # 且 configtree 导入源优先级高于本文件。
    # 裸跑 prod：APP_JWT_SECRET 未设置 → 占位符解析失败 → 应用启动失败。
    secret: ${APP_JWT_SECRET}

ai:
  internal:
    required: true

server:
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.kinlin.ai: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
