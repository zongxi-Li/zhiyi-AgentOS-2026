spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:127.0.0.1}
      port: ${SPRING_REDIS_PORT:6379}

app:
  upload:
    dir: ${APP_UPLOAD_DIR:./data/uploads}
  jwt:
    # J1.4B fail-closed：生产禁止回落仓库默认 secret。
    # 原生运行形态（N03 persistent_runtime）在进程环境注入 APP_JWT_SECRET；
    # 缺失/为空时占位符解析失败 → 应用启动失败（启动期 fail-closed）。
    secret: ${APP_JWT_SECRET}

ai:
  internal:
    required: true

server:
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.kinlin.ai: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
