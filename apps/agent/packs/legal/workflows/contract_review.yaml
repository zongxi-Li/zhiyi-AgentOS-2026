{
  "id": "legal_contract_review_v1",
  "workflowId": "legal_contract_review_v1",
  "name": "合同审查标准流程",
  "domain": "legal",
  "intent": "contract_review",
  "version": "v1",
  "runtimeEngine": "acg",
  "description": "Canonical AgentOS contract review workflow executed by the Core Native ACG ready-set scheduler with Trace, Review, Checkpoint, provenance, and self-healing.",
  "artifacts": {
    "risks": "output.artifacts.risk_detect.risks",
    "evidences": "output.artifacts.legal_evidence_match.evidences",
    "report": "output.artifacts.report_generate.report_markdown"
  },
  "planningNodes": [
    {"key": "contract-understanding", "title": "Contract Understanding", "objective": "Extract the contract structure, parties, obligations, and key terms", "capabilityRequirements": ["contract_parse"]},
    {"key": "clause-classification", "title": "Clause Classification", "objective": "Classify material contract clauses for legal analysis", "capabilityRequirements": ["clause_classify"]},
    {"key": "risk-analysis", "title": "Risk Analysis", "objective": "Identify and assess material contractual risks", "capabilityRequirements": ["risk_detect"]},
    {"key": "legal-evidence", "title": "Legal Evidence", "objective": "Match identified risks with relevant legal evidence", "capabilityRequirements": ["legal_evidence_match"]},
    {"key": "revision-advice", "title": "Revision Advice", "objective": "Produce actionable contract revision recommendations", "capabilityRequirements": ["revision_suggest"]},
    {"key": "review-decision", "title": "Review Decision", "objective": "Review high-impact conclusions before final delivery", "capabilityRequirements": ["human_review_gate"]},
    {"key": "review-report", "title": "Review Report", "objective": "Deliver a traceable contract review report", "capabilityRequirements": ["report_generate"]}
  ],
  "planningRelations": [
    {"sourceKey": "contract-understanding", "targetKey": "clause-classification", "relationType": "depends_on"},
    {"sourceKey": "clause-classification", "targetKey": "risk-analysis", "relationType": "depends_on"},
    {"sourceKey": "risk-analysis", "targetKey": "legal-evidence", "relationType": "depends_on"},
    {"sourceKey": "legal-evidence", "targetKey": "revision-advice", "relationType": "depends_on"},
    {"sourceKey": "revision-advice", "targetKey": "review-decision", "relationType": "depends_on"},
    {"sourceKey": "review-decision", "targetKey": "review-report", "relationType": "depends_on"}
  ],
  "steps": [
    {
      "stepId": "parse_contract",
      "name": "合同文本解析",
      "agentName": "contract_parse",
      "capability": "contract_parse",
      "outputSpec": {
        "type": "object",
        "required": ["contract_summary", "contract_type", "parties"],
        "properties": {
          "contract_summary": { "type": "string" },
          "contract_title": { "type": "string" },
          "contract_type": { "type": "string" },
          "parties": { "type": "array" },
          "key_dates": { "type": "array" },
          "amounts": { "type": "array" },
          "obligations": { "type": "array" },
          "scope": { "type": "string" },
          "payment_terms": { "type": "string" },
          "acceptance_terms": { "type": "string" },
          "ip_terms": { "type": "string" },
          "dispute_resolution": { "type": "string" },
          "original_preview": { "type": "string" },
          "missing_fields": { "type": "array" },
          "analysis_status": { "type": "string" },
          "_llm": { "type": "object" }
        }
      },
      "nextStepId": "classify_clauses"
    },
    {
      "stepId": "classify_clauses",
      "name": "条款分类",
      "agentName": "clause_classify",
      "capability": "clause_classify",
      "input": {
        "from": { "parse_contract": ["contract_type", "scope", "payment_terms", "acceptance_terms", "ip_terms", "dispute_resolution"] },
        "schema": { "type": "object", "required": ["contract_type"] }
      },
      "outputSpec": {
        "type": "object",
        "required": ["clauses"],
        "properties": {
          "clauses": { "type": "array" },
          "clause_count": { "type": "integer" }
        }
      },
      "nextStepId": "risk_detect"
    },
    {
      "stepId": "risk_detect",
      "name": "风险识别",
      "agentName": "risk_detect",
      "capability": "risk_detect",
      "input": {
        "from": {
          "parse_contract": ["contract_summary", "payment_terms", "acceptance_terms", "ip_terms"],
          "classify_clauses": ["clauses"]
        },
        "schema": { "type": "object", "required": ["clauses"] }
      },
      "outputSpec": {
        "type": "object",
        "required": ["risks", "risk_level", "risk_score"],
        "properties": {
          "risks": { "type": "array" },
          "risk_summary": { "type": "object" },
          "risk_level": { "type": "string" },
          "risk_score": { "type": ["number", "null"] },
          "analysis_status": { "type": "string" },
          "_llm": { "type": "object" }
        }
      },
      "nextStepId": "legal_evidence_match"
    },
    {
      "stepId": "legal_evidence_match",
      "name": "Evidence 依据匹配",
      "agentName": "legal_evidence_match",
      "capability": "legal_evidence_match",
      "input": {
        "from": {
          "parse_contract": ["contract_type"],
          "risk_detect": ["risks", "risk_level", "risk_score"]
        },
        "schema": { "type": "object", "required": ["risks"] }
      },
      "outputSpec": {
        "type": "object",
        "required": ["evidences", "citations"],
        "properties": {
          "evidences": { "type": "array" },
          "citations": { "type": "array" },
          "evidence_refs": { "type": "array" },
          "retrieval": { "type": "object" },
          "runtimeSignals": { "type": "array" }
        }
      },
      "nextStepId": "suggestion_generate"
    },
    {
      "stepId": "suggestion_generate",
      "name": "修改建议生成",
      "agentName": "revision_suggest",
      "capability": "revision_suggest",
      "input": {
        "from": {
          "risk_detect": ["risks", "risk_summary"],
          "legal_evidence_match": ["evidences", "citations"]
        },
        "schema": { "type": "object", "required": ["risks", "evidences"] }
      },
      "outputSpec": {
        "type": "object",
        "required": ["revision_suggestions", "manual_review_focus"],
        "properties": {
          "revision_suggestions": { "type": "array" },
          "risk_level": { "type": "string" },
          "manual_review_focus": { "type": "array" }
        }
      },
      "nextStepId": "human_review"
    },
    {
      "stepId": "human_review",
      "name": "人工审核",
      "agentName": "human_review",
      "capability": "human_review_gate",
      "input": {
        "from": {
          "risk_detect": ["risks", "risk_summary"],
          "suggestion_generate": ["revision_suggestions", "manual_review_focus"]
        },
        "schema": { "type": "object", "required": ["risks", "manual_review_focus"] }
      },
      "outputSpec": {
        "type": "object",
        "required": ["review_status", "review_focus"],
        "properties": {
          "review_status": { "type": "string" },
          "reviewer": { "type": ["string", "null"] },
          "review_focus": { "type": "array" },
          "risks": { "type": "array" },
          "suggested_decision": { "type": "string" }
        }
      },
      "reviewRequired": true,
      "nextStepId": "report_generate"
    },
    {
      "stepId": "report_generate",
      "name": "审查报告生成",
      "agentName": "report_generate",
      "capability": "report_generate",
      "input": {
        "from": {
          "parse_contract": ["contract_type", "parties", "scope"],
          "risk_detect": ["risks", "risk_summary"],
          "legal_evidence_match": ["evidences"],
          "suggestion_generate": ["revision_suggestions", "manual_review_focus"],
          "human_review": ["review_status", "review_focus"]
        },
        "schema": { "type": "object", "required": ["contract_type", "risks", "evidences", "revision_suggestions"] }
      },
      "outputSpec": {
        "type": "object",
        "required": ["report_markdown"],
        "properties": {
          "final_answer": { "type": "string" },
          "report_markdown": { "type": "string" },
          "_llm": { "type": "object" },
          "report": { "type": "object" }
        }
      }
    }
  ]
}
