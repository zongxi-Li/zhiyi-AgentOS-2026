{
  "workflowId": "legal_case_analysis_v1",
  "name": "法律案件分析工作流",
  "domain": "legal",
  "intent": "case_analysis",
  "version": "1.0.0",
  "description": "Demo workflow for general legal case analysis.",
  "runtimeEngine": "acg",
  "planningNodes": [
    {"key": "case-understanding", "title": "Case Understanding", "objective": "Structure the facts and legal questions in the case", "capabilityRequirements": ["case_intake"]},
    {"key": "legal-research", "title": "Legal Research", "objective": "Retrieve the statutes relevant to the case", "capabilityRequirements": ["statute_retrieval"]},
    {"key": "risk-assessment", "title": "Risk Assessment", "objective": "Assess the legal risks and required review", "capabilityRequirements": ["risk_assessment"]}
  ],
  "planningRelations": [
    {"sourceKey": "case-understanding", "targetKey": "legal-research", "relationType": "depends_on"},
    {"sourceKey": "legal-research", "targetKey": "risk-assessment", "relationType": "depends_on"}
  ],
  "steps": [
    {
      "stepId": "case_intake",
      "name": "案情接收",
      "agentName": "case_intake",
      "capability": "case_intake",
      "nextStepId": "statute"
    },
    {
      "stepId": "statute",
      "name": "法条检索",
      "agentName": "statute",
      "capability": "statute_retrieval",
      "timeout": 20,
      "maxRetries": 0,
      "nextStepId": "risk"
    },
    {
      "stepId": "risk",
      "name": "风险评估",
      "agentName": "risk",
      "capability": "risk_assessment",
      "reviewRequired": true
    }
  ]
}
