[pytest]
testpaths = tests
pythonpath = . src
markers =
    freeze_gate: focused invariant tests required by the five-minute stage-freeze gate
    slow_benchmark: performance benchmark excluded from the default stage-freeze gate
    slow_multiprocess: real process competition or stress test for explicit higher-level validation
    slow_fault_injection: long-running or combinatorial fault-injection test for explicit higher-level validation
