services:
  postgres:
    platform: linux/amd64
    build: !reset null
    image: ${KINLIN_POSTGRES_IMAGE:-kinlin-ai/postgres:windows-amd64}
  redis:
    platform: linux/amd64
    build: !reset null
    image: ${KINLIN_REDIS_IMAGE:-kinlin-ai/redis:windows-amd64}
  ai-service:
    platform: linux/amd64
    build: !reset null
    image: ${KINLIN_AI_IMAGE:-kinlin-ai/ai-service:windows-amd64}
  backend:
    platform: linux/amd64
    build: !reset null
    image: ${KINLIN_BACKEND_IMAGE:-kinlin-ai/backend:windows-amd64}
  frontend:
    platform: linux/amd64
    build: !reset null
    image: ${KINLIN_FRONTEND_IMAGE:-kinlin-ai/frontend:windows-amd64}
    networks: [web-network, windows-ingress-network]
    ports: !override
      - "127.0.0.1:${KINLIN_HTTP_PORT:-8080}:8080"
  schema-tool:
    platform: linux/amd64
    build: !reset null
    image: ${KINLIN_FLYWAY_IMAGE:-kinlin-ai/flyway:windows-amd64}
    volumes: !override
      - ./migrations:/flyway/sql:ro

networks:
  windows-ingress-network:
    name: ${KINLIN_DEPLOYMENT_ID}_windows_ingress_v11
    internal: false
    ipam:
      config:
        - subnet: ${KINLIN_INGRESS_SUBNET:-10.253.10.48/28}
    labels:
      com.kinlin.deployment-id: ${KINLIN_DEPLOYMENT_ID}
      com.kinlin.lifecycle: windows-amd64-deployment
