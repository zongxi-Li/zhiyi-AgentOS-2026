# 服务器配置（支持环境变量）
server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: federal-hub-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  # 数据库配置（支持环境变量）
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kinlin_ai}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Redis配置（支持环境变量）
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      database: ${SPRING_REDIS_DATABASE:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: false
    validate-on-migrate: true

# AI服务配置（支持环境变量）
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout: ${AI_SERVICE_CONNECT_TIMEOUT:15000}
    timeout: ${AI_SERVICE_TIMEOUT:240000}
  sse:
    idle-timeout-ms: ${SSE_IDLE_TIMEOUT:240000}
    max-duration-ms: ${SSE_MAX_DURATION:1800000}

# 应用配置
app:
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
    max-size: 10485760  # 10MB
  jwt:
    # JWT密钥 - 至少64字符（512位）用于HS512算法
    # 支持环境变量: APP_JWT_SECRET
    secret: ${APP_JWT_SECRET:kinlin-ai-development-secret-key-change-before-production-0000000000000000}
    expiration: ${APP_JWT_EXPIRATION:86400000}  # 24小时（毫秒）

# CORS跨域配置
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PATCH
  allowed-headers: "*"
  allow-credentials: true

# 日志配置
logging:
  level:
    com.kinlin.ai: INFO
    org.springframework.web: INFO
    org.hibernate: WARN

# Agent configuration
agent:
  enabled: ${AGENT_ENABLED:true}
  timeout-ms: ${AGENT_TIMEOUT_MS:240000}
  progress-timeout-ms: ${AGENT_PROGRESS_TIMEOUT_MS:5000}
  async-start-timeout-ms: ${AGENT_ASYNC_START_TIMEOUT_MS:15000}
  trace-enabled: ${AGENT_TRACE_ENABLED:false}
  python:
    lawyer-chat-url: ${AGENT_PYTHON_LAWYER_CHAT_URL:http://localhost:8000/ai/agent/lawyer/chat}
    teacher-chat-url: ${AGENT_PYTHON_TEACHER_CHAT_URL:http://localhost:8000/ai/agent/teacher/chat}
    programmer-chat-url: ${AGENT_PYTHON_PROGRAMMER_CHAT_URL:http://localhost:8000/ai/agent/programmer/chat}
    writer-chat-url: ${AGENT_PYTHON_WRITER_CHAT_URL:http://localhost:8000/ai/agent/writer/chat}
  federated:
    enabled: ${AGENT_FEDERATED_ENABLED:false}
    trace: ${AGENT_FEDERATED_TRACE:true}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,prometheus
