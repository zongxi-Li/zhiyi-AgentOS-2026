spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/kinlin_ai}
    username: ${SPRING_DATASOURCE_USERNAME:kinlin_ai}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  data:
    redis:
      host: redis
      port: 6379

app:
  upload:
    dir: /app/data/uploads

logging:
  level:
    com.kinlin.ai: DEBUG
