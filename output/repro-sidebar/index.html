<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>侧边栏历史列表复现</title>
<style>
  :root {
    --app-layout-bg: #f5f5f2;
    --sidebar-bg: #fbfbfa;
    --sidebar-border: #e8e8e4;
    --border-light: #e5e5e0;
    --bg-panel: #efefec;
    --text-primary: #202124;
    --text-secondary: #5f6368;
    --text-muted: #9aa0a6;
    --text-disabled: #bdc1c6;
    --primary-color: #6b5bd2;
    --primary-fade: rgba(107, 91, 210, 0.12);
    --scrollbar-thumb: rgba(0,0,0,.22);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --sidebar-item-icon-inset: 13px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; color: var(--text-primary); }

  .app-layout { width: 100%; height: 100%; background: var(--app-layout-bg); overflow: hidden; display: flex; flex-direction: column; }
  .app-shell-body { display: flex; flex: 1 1 auto; min-width: 0; min-height: 0; width: 100%; overflow: hidden; }
  .app-sidebar { position: relative; background-color: transparent; border-right: 1px solid var(--border-light); display: flex; flex-direction: row; overflow: hidden; }
  .primary-sidebar { flex: 0 0 auto; width: 64px; height: 100%; min-width: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--sidebar-bg); }

  .chat-side-panel {
    position: relative; z-index: 1; flex: 0 0 auto; min-width: 0; height: 100%;
    display: flex; flex-direction: column; overflow: hidden; background: var(--sidebar-bg);
    box-shadow: 10px 0 24px rgba(16, 18, 33, 0.04);
  }
  .chat-panel-content { min-width: 160px; flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 10px 12px; overflow: hidden; }

  .workspace-switch { display: flex; margin: 0 2px 10px; border: 1px solid var(--border-light); border-radius: 10px; overflow: hidden; }
  .workspace-switch-btn { flex: 1; min-height: 36px; border: 0; background: transparent; cursor: pointer; font: inherit; }
  .workspace-switch-btn.active { background: var(--bg-panel); }

  .chat-nav-trigger,
  .chat-submenu-action,
  .chat-project-item {
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--text-secondary);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .chat-submenu-action,
  .chat-project-item {
    min-height: 32px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 9px;
    border-radius: 7px;
    font-size: 12px;
    transition: background-color 0.16s ease, color 0.16s ease;
  }

  .new-chat-action { min-height: 34px; margin-bottom: 8px; justify-content: flex-start; padding: 0 9px; border: 0; background: transparent; color: var(--text-primary); font-weight: 550; }
  .new-chat-action:hover { background: var(--bg-panel); }

  .chat-submenu-section-head { min-height: 36px; display: flex; align-items: center; gap: 8px; padding: 4px 8px 6px; color: var(--text-disabled); font-size: 12px; font-weight: 700; }
  .chat-submenu-section-title { min-width: 0; flex: 1 1 auto; white-space: nowrap; }
  .chat-submenu-section-tools { min-width: 0; flex: 0 1 auto; display: flex; align-items: center; gap: 6px; }
  .acg-role-filter--sidebar { position: relative; min-width: 0; display: block; }
  .acg-role-filter--sidebar select { width: 90px; height: 28px; padding: 0 25px 0 9px; border: 1px solid var(--border-light); border-radius: 6px; appearance: none; background: #fff; font: inherit; font-size: 11px; font-weight: 650; }
  .chat-project-count { min-width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-disabled); font-size: 11px; }

  .chat-project-list {
    min-height: 0;
    flex: 1 1 auto;
    display: grid;
    grid-auto-rows: max-content;
    align-content: start;
    gap: 3px;
    padding: 2px 2px 8px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar-thumb) transparent;
  }

  .chat-project-row {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: stretch;
    gap: 2px;
    border: 0;
    border-left: 2px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--text-secondary);
    overflow: hidden;
    transition: background-color 0.16s ease, color 0.16s ease;
  }

  .chat-project-item {
    min-width: 0;
    min-height: 34px;
    gap: 8px;
    padding: 6px 38px 6px 9px;
    border-radius: 8px;
    color: inherit;
    font-size: 12.5px;
    font-weight: 450;
  }

  .chat-project-copy { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: row; align-items: center; gap: 8px; }
  .chat-project-title, .chat-project-time { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-project-title { min-width: 0; flex: 0 1 auto; color: inherit; line-height: 1.35; }
  .chat-project-time { flex: 0 0 auto; margin-left: auto; color: var(--text-disabled); font-size: 11px; line-height: 1.2; }

  .chat-project-action-trigger { width: 30px; min-height: 32px; display: inline-grid; place-items: center; padding: 0; border: 0; background: transparent; color: var(--text-disabled); opacity: 0; }

  .app-main { flex: 1 1 auto; min-width: 0; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 40px; }
</style>
</head>
<body>
  <div class="app-layout">
    <div class="app-shell-body">
      <div class="app-sidebar">
        <nav class="primary-sidebar"></nav>
        <section class="chat-side-panel" style="width: 520px;">
          <div class="chat-panel-content">
            <div class="workspace-switch">
              <button class="workspace-switch-btn active">Agent</button>
              <button class="workspace-switch-btn">Chat</button>
            </div>
            <button class="chat-submenu-action new-chat-action">新建 Agent 任务</button>
            <div class="chat-submenu-section-head">
              <span class="chat-submenu-section-title">工程项目</span>
              <div class="chat-submenu-section-tools">
                <label class="acg-role-filter--sidebar"><select><option>全部角色</option></select></label>
                <span class="chat-project-count">39</span>
              </div>
            </div>
            <div class="chat-project-list" id="list"></div>
            <button class="chat-submenu-action history-action">查看所有 ACG 记录</button>
          </div>
        </section>
      </div>
      <main class="app-main">中午好，休息…</main>
    </div>
  </div>
  <script>
    const titles = [
      '基于堆叠的NVMe SSD盘阵列存储沙盘演示工程',
      'SPD合金夹具结构设计与公差分析项目',
      '集成化erp财务对账自动化流水线工程',
      '基于大模型的合同条款风险审查助手工程',
      '智慧园区能耗监测与预测平台建设项目',
      '多智能体协同排产调度算法验证工程',
    ];
    const states = ['已停止', '已完成', '运行中', '失败'];
    const list = document.getElementById('list');
    let html = '';
    for (let i = 1; i <= 39; i++) {
      const t = titles[i % titles.length] + ' ' + i;
      const s = states[i % states.length];
      const hh = String(9 + (i % 12)).padStart(2, '0');
      const mm = String((i * 7) % 60).padStart(2, '0');
      html += `<div class="chat-project-row">
        <button class="chat-project-item" type="button">
          <span class="chat-project-copy">
            <span class="chat-project-title">${t}</span>
            <span class="chat-project-time">${s} · ${hh}:${mm}</span>
          </span>
        </button>
        <button class="chat-project-action-trigger" type="button">⋯</button>
      </div>`;
    }
    list.innerHTML = html;
  </script>
</body>
</html>
