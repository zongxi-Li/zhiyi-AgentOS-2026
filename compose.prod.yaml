x-prod-security-base: &prod-security-base
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-prod-secret-tmpfs: &prod-secret-tmpfs
  - /run/secrets:rw,nosuid,nodev,noexec,size=1m,mode=0755

services:
  frontend:
    <<: *prod-security-base
    ports:
      - "${KINLIN_BIND_ADDRESS:-127.0.0.1}:${KINLIN_HTTP_PORT:-8080}:8080"
    cpus: ${KINLIN_FRONTEND_CPUS:-0.5}
    mem_limit: ${KINLIN_FRONTEND_MEMORY:-256m}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
  backend:
    <<: *prod-security-base
    cpus: ${KINLIN_BACKEND_CPUS:-2.0}
    mem_limit: ${KINLIN_BACKEND_MEMORY:-2g}
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs: *prod-secret-tmpfs
  ai-service:
    <<: *prod-security-base
    cpus: ${KINLIN_AI_CPUS:-4.0}
    mem_limit: ${KINLIN_AI_MEMORY:-4g}
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      - /run/secrets:rw,nosuid,nodev,noexec,size=1m,mode=0755
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
  postgres:
    <<: *prod-security-base
    cpus: ${KINLIN_POSTGRES_CPUS:-2.0}
    mem_limit: ${KINLIN_POSTGRES_MEMORY:-2g}
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      - /run/secrets:rw,nosuid,nodev,noexec,size=1m,mode=0755
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
      - /var/run/postgresql:rw,nosuid,nodev,noexec,size=16m,mode=3775
  redis:
    <<: *prod-security-base
    cpus: ${KINLIN_REDIS_CPUS:-1.0}
    mem_limit: ${KINLIN_REDIS_MEMORY:-512m}
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      - /run/secrets:rw,nosuid,nodev,noexec,size=1m,mode=0755
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
  schema-tool:
    <<: *prod-security-base
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      - /run/secrets:rw,nosuid,nodev,noexec,size=1m,mode=0755
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
