<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="知弈 AgentOS 花环标识">
  <title>知弈 AgentOS</title>
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffdf8" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#fffdf8" stop-opacity="0.98"/>
      <stop offset="0.9" stop-color="#f4e8d2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f4e8d2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8cfa2" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#e8cfa2" stop-opacity="0"/>
    </radialGradient>
    <path id="orbitA" d="M120.0 10 A110 110 0 0 1 120.0 230 A110 110 0 0 1 120.0 10"/>
    <path id="orbitB" d="M120.0 2 A118 118 0 0 1 120.0 238 A118 118 0 0 1 120.0 2"/>
  </defs>

  <circle cx="120.0" cy="120.0" r="98" fill="none" stroke="#a9823f" stroke-opacity="0.26" stroke-width="1"/>

  <g fill="none" stroke="#a9823f" stroke-width="0.9">
    <circle cx="120.0" cy="120.0" r="110" stroke-opacity="0.28" stroke-dasharray="1 8">
      <animateTransform attributeName="transform" type="rotate" from="0 120.0 120.0" to="360 120.0 120.0" dur="64s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120.0" cy="120.0" r="118" stroke-opacity="0.14" stroke-dasharray="20 12">
      <animateTransform attributeName="transform" type="rotate" from="360 120.0 120.0" to="0 120.0 120.0" dur="96s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle r="2.6" fill="#a9823f">
    <animateMotion dur="24s" repeatCount="indefinite"><mpath href="#orbitA"/></animateMotion>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.8" fill="#a9823f">
    <animateMotion dur="36s" begin="5s" repeatCount="indefinite"><mpath href="#orbitB"/></animateMotion>
    <animate attributeName="opacity" values="0.3;0.85;0.3" dur="5.4s" repeatCount="indefinite"/>
  </circle>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -3;0 3;0 -3" dur="10s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 120.0 120.0;5 120.0 120.0;-5 120.0 120.0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="16s" repeatCount="indefinite"/>
      <image x="34" y="34" width="172" height="172" href="data:image/webp;base64," preserveAspectRatio="xMidYMid meet"/>
    </g>
  </g>
</svg>
