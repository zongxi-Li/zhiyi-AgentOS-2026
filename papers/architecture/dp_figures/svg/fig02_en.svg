" width="1300" height="55" rx="4.4" ry="4.4" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#243746" font-family="Arial" text-anchor="start" font-size="23px" style="fill: rgb(36, 55, 70);"><g transform="translate(70,798) scale(1)"><text><tspan>Any failure before step 6 blocks sending. Unknown egress retains its charge (Figures 3 and 5).</tspan></text></g></g></g></g></g></g></g></svg>