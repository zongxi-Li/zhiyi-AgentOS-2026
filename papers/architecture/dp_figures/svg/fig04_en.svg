reservation</tspan></text></g></g></g></g><g data-cell-id="fig04_rho"><g><rect x="65" y="490" width="500" height="100" rx="8" ry="8" fill="#f1eef6" stroke="#74658c" stroke-width="1.5" pointer-events="all" style="fill: rgb(241, 238, 246); stroke: rgb(116, 101, 140);"/></g><g><g fill="#243746" font-family="Arial" text-anchor="middle" data-blockTextHeight="62.400000000000006" data-htmlContentWidth="256.369140625" font-size="26px" style="fill: rgb(36, 55, 70);"><g transform="translate(315,508.8) scale(1)"><text y="26" data-line-font-size="26" x="0"><tspan>Charged account R(α)</tspan></text><text y="57.2" data-line-font-size="26" x="0"><tspan>includes reservations</tspan></text></g></g></g></g><g data-cell-id="fig04_cost"><g><rect x="65" y="640" width="500" height="100" rx="8" ry="8" fill="#f1eef6" stroke="#74658c" stroke-width="1.5" pointer-events="all" style="fill: rgb(241, 238, 246); stroke: rgb(116, 101, 140);"/></g><g><g fill="#243746" font-family="Arial" text-anchor="middle" data-blockTextHeight="62.400000000000006" data-htmlContentWidth="295.3564453125" font-size="26px" style="fill: rgb(36, 55, 70);"><g transform="translate(315,658.8) scale(1)"><text y="26" data-line-font-size="26" x="0"><tspan>Public-schedule cost cₜ(α)</tspan></text><text y="57.2" data-line-font-size="26" x="0"><tspan>= αΔₜ² / (2sₜ²)</tspan></text></g></g></g></g><g data-cell-id="fig04_convert"><g><rect x="700" y="530" width="675" height="150" rx="12" ry="12" fill="#f1eef6" stroke="#74658c" stroke-width="1.5" pointer-events="all" style="fill: rgb(241, 238, 246); stroke: rgb(116, 101, 140);"/></g><g><g fill="#243746" font-family="Arial" text-anchor="middle" data-blockTextHeight="90" data-htmlContentWidth="266.845703125" font-size="25px" style="fill: rgb(36, 55, 70);"><g transform="translate(1037.5,560) scale(1)"><text y="25" data-line-font-size="25" x="0"><tspan>Prospective ε at fixed δ*</tspan></text><text y="55" data-line-font-size="25" x="0"><tspan>minα {R(α) + cₜ(α)</tspan></text><text y="85" data-line-font-size="25" x="0"><tspan>+ ln(1/δ*) / (α − 1)}</tspan></text></g></g></g></g><g data-cell-id="fig04_e_account"><g><path d="M 565 540 L 635 540 L 635 575 L 687.19 575" fill="none" stroke="#617482" stroke-width="1.8" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(97, 116, 130);"/><path d="M 697.99 575 L 687.19 580.4 L 687.19 569.6 Z" fill="#617482" stroke="#617482" stroke-width="1.8" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(97, 116, 130); stroke: rgb(97, 116, 130);"/></g></g><g data-cell-id="fig04_e_cost"><g><path d="M 565 690 L 635 690 L 635 635 L 687.19 635" fill="none" stroke="#617482" stroke-width="1.8" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(97, 116, 130);"/><path d="M 697.99 635 L 687.19 640.4 L 687.19 629.6 Z" fill="#617482" stroke="#617482" stroke-width="1.8" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(97, 116, 130); stroke: rgb(97, 116, 130);"/></g></g><g data-cell-id="fig04_accept"><g><rect x="700" y="770" width="675" height="90" rx="7.2" ry="7.2" fill="#eaf4f1" stroke="#267c78" stroke-width="1.5" pointer-events="all" style="fill: rgb(234, 244, 241); stroke: rgb(38, 124, 120);"/></g><g><g fill="#243746" font-family="Arial" text-anchor="middle" data-blockTextHeight="62.400000000000006" data-htmlContentWidth="368.443359375" font-size="26px" style="fill: rgb(36, 55, 70);"><g transform="translate(1037.5,783.8) scale(1)"><text y="26" data-line-font-size="26" x="0"><tspan>Within ε limit: reserve atomically</tspan></text><text y="57.2" data-line-font-size="26" x="0"><tspan>R(α) ← R(α) + cₜ(α)</tspan></text></g></g></g></g><g data-cell-id="fig04_deny"><g><rect x="65" y="790" width="500" height="70" rx="5.6" ry="5.6" fill="#fff1e8" stroke="#a85a32" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 241, 232); stroke: rgb(168, 90, 50);"/></g><g><g fill="#243746" font-family="Arial" text-anchor="middle" data-blockTextHeight="57.599999999999994" data-htmlContentWidth="346.8046875" font-size="24px" style="fill: rgb(36, 55, 70);"><g transform="translate(315,796.2) scale(1)"><text y="24" data-line-font-size="24" x="0"><tspan>Over limit / incompatible account</tspan></text><text y="52.8" data-line-font-size="24" x="0"><tspan>reject without sending</tspan></text></g></g></g></g><g data-cell-id="fig04_e_accept"><g><path d="M 1206.25 680 L 1206.25 757.19" fill="none" stroke="#617482" stroke-width="1.8" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(97, 116, 130);"/><path d="M 1206.25 767.99 L 1200.85 757.19 L 1211.65 757.19 Z" fill="#617482" stroke="#617482" stroke-width="1.8" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(97, 116, 130); stroke: rgb(97, 116, 130);"/></g><g><g fill="#243746" font-family="Arial" text-anchor="middle" font-size="23px" style="fill: rgb(36, 55, 70);"><rect fill="#FFFFFF" stroke="none" x="1226" y="712" width="51" height="29" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="1251.25" y="735.5">pass</text></g></g></g><g data-cell-id="fig04_e_deny"><g><path d="M 801.25 680 L 801 760 L 315 760 L 315 777.19" fill="none" stroke="#a85a32" stroke-width="1.8" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(168, 90, 50);"/><path d="M 315 787.99 L 309.6 777.19 L 320.4 777.19 Z" fill="#a85a32" stroke="#a85a32" stroke-width="1.8" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(168, 90, 50); stroke: rgb(168, 90, 50);"/></g><g><g fill="#243746" font-family="Arial" text-anchor="middle" font-size="23px" style="fill: rgb(36, 55, 70);"><rect fill="#FFFFFF" stroke="none" x="568" y="749" width="31" height="29" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="583" y="772.5">fail</text></g></g></g><g data-cell-id="fig04_scope"><g><rect x="65" y="890" width="1300" height="35" rx="2.8" ry="2.8" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#243746" font-family="Arial" text-anchor="start" font-size="23px" style="fill: rgb(36, 55, 70);"><g transform="translate(65,918) scale(1)"><text><tspan>Fixed public cost schedule; conditional bounds; no subsampling amplification.</tspan></text></g></g></g></g></g></g></g></svg>