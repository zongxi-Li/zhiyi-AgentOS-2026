server {
    listen 8080;
    server_name localhost;
    charset utf-8;
    charset_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:8080;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"kinlin-frontend"}';
    }

    # Keep /api prefix for backend controllers that are actually mapped under /api/*
    # (align with frontend/vite.config.ts proxy rewrite behavior).
    location ~ ^/api/(digital-human|kylin-os|emotion|knowledge-graph|role-fusion|alerts|feedback|federated-models)(/.*)?$ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Trace-Id $kinlin_trace_id;
        proxy_hide_header X-Trace-Id;
        add_header X-Trace-Id $kinlin_trace_id always;
        proxy_set_header X-Internal-Service-Token "";
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Tenant-Id "";
        proxy_connect_timeout 15s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    # Strip /api prefix for controllers mapped at root (e.g. /auth, /chat, /roles).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Trace-Id $kinlin_trace_id;
        proxy_hide_header X-Trace-Id;
        add_header X-Trace-Id $kinlin_trace_id always;
        proxy_set_header X-Internal-Service-Token "";
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Tenant-Id "";
        proxy_connect_timeout 15s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    # Streaming AI endpoint goes through the Java gateway; buffering stays disabled.
    location ~ ^/ai/(chat/text/stream|test/sse)$ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Trace-Id $kinlin_trace_id;
        proxy_hide_header X-Trace-Id;
        add_header X-Trace-Id $kinlin_trace_id always;
        proxy_set_header X-Internal-Service-Token "";
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Tenant-Id "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_send_timeout 1900s;
        proxy_read_timeout 1900s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
    }

    # Other AI endpoints via backend /ai routes.
    location ^~ /ai/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Trace-Id $kinlin_trace_id;
        proxy_hide_header X-Trace-Id;
        add_header X-Trace-Id $kinlin_trace_id always;
        proxy_set_header X-Internal-Service-Token "";
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Tenant-Id "";
        proxy_connect_timeout 15s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

