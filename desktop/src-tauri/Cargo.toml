[package]
name = "kinlin-desktop"
version = "0.1.0"
description = "知弈 AgentOS desktop shell"
authors = ["知弈 AgentOS"]
license = "MIT"
edition = "2021"

[lib]
name = "kinlin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
