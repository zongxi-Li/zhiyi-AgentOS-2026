name: ${KINLIN_DEPLOYMENT_ID:?KINLIN_DEPLOYMENT_ID is required}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  labels:
    com.kinlin.deployment-id: ${KINLIN_DEPLOYMENT_ID}

x-prod-security-base: &prod-security-base
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-prod-secret-tmpfs: &prod-secret-tmpfs
  - /run/secrets:rw,nosuid,nodev,noexec,size=1m,mode=0755
  - /run/kinlin-secrets:rw,nosuid,nodev,noexec,size=1m,mode=0750
  - /tmp:rw,nosuid,nodev,size=64m,mode=1777

services:
  postgres:
    <<: [*service-defaults, *prod-security-base]
    build:
      context: ./ops/docker/postgres
    image: ${KINLIN_POSTGRES_IMAGE:-kinlin-ai-postgres:dev}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${KINLIN_DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      KINLIN_DB_PASSWORD_FILE: /run/kinlin-secrets/db_password
      KINLIN_DB_NAME: ${KINLIN_DB_NAME:-kinlin_ai}
      KINLIN_DB_USER: ${KINLIN_DB_USER:-kinlin_ai}
      KINLIN_SKIP_APP_INIT: ${KINLIN_SKIP_APP_INIT:-false}
    secrets: [db_admin_password, db_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/20-kinlin-app-role.sh:ro
    cpus: ${KINLIN_POSTGRES_CPUS:-2.0}
    mem_limit: ${KINLIN_POSTGRES_MEMORY:-2g}
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      - /run/secrets:rw,nosuid,nodev,noexec,size=1m,mode=0755
      - /run/kinlin-secrets:rw,nosuid,nodev,noexec,size=1m,mode=0750
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
      - /var/run/postgresql:rw,nosuid,nodev,noexec,size=16m,mode=3775
    networks: [data-network]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    <<: [*service-defaults, *prod-security-base]
    build:
      context: ./ops/docker/redis
    image: ${KINLIN_REDIS_IMAGE:-kinlin-ai-redis:dev}
    secrets: [redis_password]
    environment:
      KINLIN_DEPLOYMENT_ID: ${KINLIN_DEPLOYMENT_ID}
    volumes:
      - redis-data:/data
    cpus: ${KINLIN_REDIS_CPUS:-1.0}
    mem_limit: ${KINLIN_REDIS_MEMORY:-512m}
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      - /run/secrets:rw,nosuid,nodev,noexec,size=1m,mode=0755
      - /run/kinlin-secrets:rw,nosuid,nodev,noexec,size=1m,mode=0750
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    networks: [data-network, provider-state-network]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/kinlin-redis-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  ai-service:
    <<: [*service-defaults, *prod-security-base]
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    image: ${KINLIN_AI_IMAGE:-kinlin-ai-service:dev}
    environment:
      KINLIN_DEPLOYMENT_ID: ${KINLIN_DEPLOYMENT_ID}
      ENVIRONMENT: ${KINLIN_ENVIRONMENT:-production}
      PYTHONPATH: /app:/app/agent:/app/agentOS:/app/agentOS/src
      AGENTOS_PACKS_DIR: /app/agent/packs
      AGENTOS_DATA_DIR: /app/data/agentos
      AGENTOS_WORKFLOW_DB_PATH: /app/data/agentos/workflows.sqlite3
      AGENTOS_LANGGRAPH_CHECKPOINT_DB: /app/data/agentos/langgraph_checkpoints.sqlite3
      AGENTOS_EXECUTION_VALUE_DB: /app/data/agentos/execution_values.sqlite3
      AGENTOS_CONTENT_MANIFEST_DB: /app/data/agentos/content_manifests.sqlite3
      AGENTOS_EXECUTION_MEMORY_DB: /app/data/agentos/execution_memory.sqlite3
      AGENTOS_PROVENANCE_DB: /app/data/agentos/provenance.sqlite3
      AGENTOS_AUDIT_DB: /app/data/agentos/audit_decisions.sqlite3
      AGENTOS_EVOLUTION_DB: /app/data/agentos/evolution.sqlite3
      AGENTOS_IDENTITY_DB: /app/data/agentos/identity_v2.sqlite3
      AGENTOS_ATTACHMENT_STORAGE_DIR: /app/data/agentos/attachments
      AGENTOS_ATTACHMENT_MAX_FILE_BYTES: ${AGENTOS_ATTACHMENT_MAX_FILE_BYTES:-}
      AGENTOS_ATTACHMENT_MAX_TOTAL_BYTES: ${AGENTOS_ATTACHMENT_MAX_TOTAL_BYTES:-}
      AGENTOS_ATTACHMENT_MAX_CONTEXT_CHARACTERS: ${AGENTOS_ATTACHMENT_MAX_CONTEXT_CHARACTERS:-120000}
      AGENTOS_SQLITE_BUSY_TIMEOUT_MS: ${AGENTOS_SQLITE_BUSY_TIMEOUT_MS:-5000}
      # read_only 根文件系统下 SQLite 临时目录落到 /tmp tmpfs(256m)，大排序溢出会
      # 误报 database or disk is full；指向数据卷交给真实磁盘（2026-09-08 run_889c69df00b4 根因）
      SQLITE_TMPDIR: /app/data
      UVICORN_WORKERS: "1"
      AI_INTERNAL_TOKEN_FILE: /run/kinlin-secrets/ai_internal_token
      AGENTOS_RESOURCE_CREDENTIAL_KEY_FILE: /run/kinlin-secrets/agentos_resource_credential_key
      DEEPSEEK_API_KEY_FILE: /run/kinlin-secrets/deepseek_api_key
      GLM_API_KEY_FILE: /run/kinlin-secrets/glm_api_key
      DASHSCOPE_API_KEY_FILE: /run/kinlin-secrets/dashscope_api_key
      TEXT_ENGINE: ${TEXT_ENGINE:-auto}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_ENABLED: ${DEEPSEEK_ENABLED:-true}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      GLM_MODEL: ${GLM_MODEL:-glm-5.3-flash}
      AGENTOS_LLM_STREAM_JSON: ${AGENTOS_LLM_STREAM_JSON:-true}
      AGENTOS_LLM_PLANNING_TIMEOUT_SECONDS: ${AGENTOS_LLM_PLANNING_TIMEOUT_SECONDS:-480}
      AGENTOS_LLM_PLANNING_TOTAL_TIMEOUT_SECONDS: ${AGENTOS_LLM_PLANNING_TOTAL_TIMEOUT_SECONDS:-660}
      AGENTOS_LLM_PLANNING_WATCHDOG_SECONDS: ${AGENTOS_LLM_PLANNING_WATCHDOG_SECONDS:-1800}
      AGENTOS_LLM_PLANNING_RETRY_TIMEOUT_SECONDS: ${AGENTOS_LLM_PLANNING_RETRY_TIMEOUT_SECONDS:-600}
      AGENTOS_LLM_PLANNING_MAX_RETRIES: ${AGENTOS_LLM_PLANNING_MAX_RETRIES:-2}
      AGENTOS_MODEL_MAX_CONCURRENCY: ${AGENTOS_MODEL_MAX_CONCURRENCY:-4}
      AGENTOS_MODEL_MIN_INTERVAL_SECONDS: ${AGENTOS_MODEL_MIN_INTERVAL_SECONDS:-0}
      GLM_ENABLED: ${GLM_ENABLED:-true}
      GLM_NATIVE_SEARCH_ENABLED: ${GLM_NATIVE_SEARCH_ENABLED:-true}
      GLM_WEB_SEARCH_URL: ${GLM_WEB_SEARCH_URL:-https://open.bigmodel.cn/api/paas/v4/web_search}
      GLM_WEB_READER_URL: ${GLM_WEB_READER_URL:-https://open.bigmodel.cn/api/paas/v4/reader}
      GLM_WEB_SEARCH_ENGINE: ${GLM_WEB_SEARCH_ENGINE:-search_std}
      GLM_WEB_SEARCH_CONTENT_SIZE: ${GLM_WEB_SEARCH_CONTENT_SIZE:-medium}
      GLM_WEB_SEARCH_RECENCY_FILTER: ${GLM_WEB_SEARCH_RECENCY_FILTER:-noLimit}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL_BALANCED: ${QWEN_MODEL_BALANCED:-qwen-plus}
      QWEN_ENABLED: ${QWEN_ENABLED:-true}
      AGENTOS_LLM_PROVIDER: ${AGENTOS_LLM_PROVIDER:-}
      AGENTOS_LLM_BASE_URL: ${AGENTOS_LLM_BASE_URL:-}
      AGENTOS_LLM_MODEL: ${AGENTOS_LLM_MODEL:-}
      TAVILY_API_KEY_FILE: /run/kinlin-secrets/tavily_api_key
      TOOL_RUNTIME_ENABLED: ${TOOL_RUNTIME_ENABLED:-true}
      TOOL_CODEBASE_ROOT: /app/workspace
      XDG_CACHE_HOME: /app/.cache
      ANONYMIZED_TELEMETRY: "False"
      CHROMA_TELEMETRY_ENABLED: "false"
      PROVIDER_STATE_ENABLED: ${PROVIDER_STATE_ENABLED:-true}
      PROVIDER_STATE_REDIS_URL: redis://redis:6379/0
      AGENTOS_COORDINATION_REDIS_URL: redis://redis:6379/1
      PROVIDER_STATE_TTL_SECONDS: ${PROVIDER_STATE_TTL_SECONDS:-3600}
      REDIS_PASSWORD_FILE: /run/kinlin-secrets/redis_password
    secrets: [ai_internal_token, agentos_resource_credential_key, deepseek_api_key, glm_api_key, dashscope_api_key, tavily_api_key, redis_password]
    volumes:
      - agentos-data:/app/data
      - ai-cache:/app/.cache
    tmpfs:
      - /run/secrets:rw,nosuid,nodev,noexec,size=1m,mode=0755
      - /run/kinlin-secrets:rw,nosuid,nodev,noexec,size=1m,mode=0750
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    cpus: ${KINLIN_AI_CPUS:-4.0}
    mem_limit: ${KINLIN_AI_MEMORY:-4g}
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    networks: [agent-network, provider-state-network]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 10
      start_period: 20s

  backend:
    <<: [*service-defaults, *prod-security-base]
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: ${KINLIN_BACKEND_IMAGE:-kinlin-ai-backend:dev}
    environment:
      KINLIN_DEPLOYMENT_ID: ${KINLIN_DEPLOYMENT_ID}
      SPRING_PROFILES_ACTIVE: ${KINLIN_SPRING_PROFILE:-prod}
      SPRING_CONFIG_IMPORT: configtree:/run/kinlin-secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${KINLIN_DB_NAME:-kinlin_ai}
      SPRING_DATASOURCE_USERNAME: ${KINLIN_DB_USER:-kinlin_ai}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      AI_SERVICE_URL: http://ai-service:8000
      # runs/trace 等读接口经 ai-service 大 payload 全表扫描，热态即 3-4s，
      # 5s 默认会在 run 进行期稳定超时；各栈经 env 覆盖（见 .env.windows）
      AGENT_PROGRESS_TIMEOUT_MS: ${AGENT_PROGRESS_TIMEOUT_MS:-5000}
      AGENT_ASYNC_START_TIMEOUT_MS: ${AGENT_ASYNC_START_TIMEOUT_MS:-15000}
      AGENTOS_LLM_PLANNING_TIMEOUT_SECONDS: ${AGENTOS_LLM_PLANNING_TIMEOUT_SECONDS:-900}
      AGENTOS_LLM_PLANNING_TOTAL_TIMEOUT_SECONDS: ${AGENTOS_LLM_PLANNING_TOTAL_TIMEOUT_SECONDS:-0}
      AGENTOS_LLM_PLANNING_WATCHDOG_SECONDS: ${AGENTOS_LLM_PLANNING_WATCHDOG_SECONDS:-1800}
      AGENTOS_LLM_PLANNING_RETRY_TIMEOUT_SECONDS: ${AGENTOS_LLM_PLANNING_RETRY_TIMEOUT_SECONDS:-600}
      AGENTOS_LLM_PLANNING_MAX_RETRIES: ${AGENTOS_LLM_PLANNING_MAX_RETRIES:-2}
      APP_UPLOAD_DIR: /app/data/uploads
      CORS_ALLOWED_ORIGINS: "${KINLIN_PUBLIC_ORIGIN:-http://localhost},http://localhost:8080,http://127.0.0.1:8080,http://tauri.localhost,tauri://localhost,http://127.0.0.1:15100,http://localhost:15100,http://127.0.0.1:3000,http://localhost:3000"
    secrets: [db_password, redis_password, jwt_secret, ai_internal_token]
    volumes:
      - backend-uploads:/app/data/uploads
    tmpfs: *prod-secret-tmpfs
    cpus: ${KINLIN_BACKEND_CPUS:-2.0}
    mem_limit: ${KINLIN_BACKEND_MEMORY:-2g}
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    networks: [web-network, agent-network, data-network]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://$$(cat /tmp/backend-listen-address):8080/health/ready"]
      interval: 15s
      timeout: 7s
      retries: 10
      start_period: 30s

  frontend:
    <<: [*service-defaults, *prod-security-base]
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: ${KINLIN_FRONTEND_IMAGE:-kinlin-ai-frontend:dev}
    ports:
      - "${KINLIN_BIND_ADDRESS:-127.0.0.1}:${KINLIN_HTTP_PORT:-8080}:8080"
    cpus: ${KINLIN_FRONTEND_CPUS:-0.5}
    mem_limit: ${KINLIN_FRONTEND_MEMORY:-256m}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    networks: [web-network, web-public]
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # MANUAL_TOOL: 手工运维 Flyway CLI（--profile migration run --rm --no-deps schema-tool migrate）。
  # 生产 schema mutation 的唯一正式 owner 是 backend 启动期 Flyway
  # （application.yml/application-prod.yml/application-compose.yml: flyway.enabled=true, ddl-auto=validate）。
  # 本服务不得接入自动化部署路径，避免与 application startup 形成双迁移执行器。
  schema-tool:
    <<: [*service-defaults, *prod-security-base]
    profiles: [migration]
    build:
      context: ./ops/docker/flyway
    image: ${KINLIN_FLYWAY_IMAGE:-kinlin-ai-flyway:dev}
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${KINLIN_DB_NAME:-kinlin_ai}
      FLYWAY_USER: ${KINLIN_DB_USER:-kinlin_ai}
    secrets: [db_password]
    volumes:
      - ./apps/backend/src/main/resources/db/migration:/flyway/sql:ro
    tmpfs:
      - /run/secrets:rw,nosuid,nodev,noexec,size=1m,mode=0755
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    networks: [data-network]
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  db_admin_password:
    file: ${KINLIN_SECRETS_DIR:?KINLIN_SECRETS_DIR is required}/db_admin_password
  db_password:
    file: ${KINLIN_SECRETS_DIR:?KINLIN_SECRETS_DIR is required}/db_password
  redis_password:
    file: ${KINLIN_SECRETS_DIR:?KINLIN_SECRETS_DIR is required}/redis_password
  jwt_secret:
    file: ${KINLIN_SECRETS_DIR:?KINLIN_SECRETS_DIR is required}/jwt_secret
  ai_internal_token:
    file: ${KINLIN_SECRETS_DIR:?KINLIN_SECRETS_DIR is required}/ai_internal_token
  agentos_resource_credential_key:
    file: ${KINLIN_SECRETS_DIR:?KINLIN_SECRETS_DIR is required}/agentos_resource_credential_key
  deepseek_api_key:
    file: ${KINLIN_SECRETS_DIR:?KINLIN_SECRETS_DIR is required}/deepseek_api_key
  glm_api_key:
    file: ${KINLIN_SECRETS_DIR:?KINLIN_SECRETS_DIR is required}/glm_api_key
  dashscope_api_key:
    file: ${KINLIN_SECRETS_DIR:?KINLIN_SECRETS_DIR is required}/dashscope_api_key
  tavily_api_key:
    file: ${KINLIN_SECRETS_DIR:?KINLIN_SECRETS_DIR is required}/tavily_api_key

volumes:
  postgres-data:
    name: ${KINLIN_DEPLOYMENT_ID}_postgres_data_v11
    labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}
  redis-data:
    name: ${KINLIN_DEPLOYMENT_ID}_redis_data_v11
    labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}
  agentos-data:
    name: ${KINLIN_DEPLOYMENT_ID}_agentos_data_v12
    labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}
  backend-uploads:
    name: ${KINLIN_DEPLOYMENT_ID}_backend_uploads_v11
    labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}
  ai-cache:
    name: ${KINLIN_DEPLOYMENT_ID}_ai_cache_v11
    labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}

networks:
  web-network:
    name: ${KINLIN_DEPLOYMENT_ID}_web_network_v11
    internal: true
    labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}
  web-public:
    name: ${KINLIN_DEPLOYMENT_ID}_web_public_network_v11
    labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}
  agent-network:
    name: ${KINLIN_DEPLOYMENT_ID}_agent_network_v11
    internal: false
    labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}
  data-network:
    name: ${KINLIN_DEPLOYMENT_ID}_data_network_v11
    internal: true
    labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}
  provider-state-network:
    name: ${KINLIN_DEPLOYMENT_ID}_provider_state_network_v11
    internal: true
    labels: {com.kinlin.deployment-id: "${KINLIN_DEPLOYMENT_ID}"}
